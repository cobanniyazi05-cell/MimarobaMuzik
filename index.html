function useFirestoreList(name) {
    const [items, setItems] = useState([]);
    const [loaded, setLoaded] = useState(false);
    useEffect(() => {
        if (!firebaseReady) {
            setLoaded(true);
            return;
        }
        const ref = db.collection("data").doc(name);
        const unsub = ref.onSnapshot(snap => {
            const d = snap.data();
            setItems(d && d.items ? d.items : []);
            setLoaded(true);
        }, err => { console.error("Firestore okuma hatası", name, err); setLoaded(true); });
        return () => unsub();
    }, [name]);
    const persist = useCallback(async (next) => {
        setItems(next);
        if (!firebaseReady) return;
        try {
            await db.collection("data").doc(name).set({ items: next });
        } catch (e) {
            console.error("Firestore yazma hatası", name, e);
        }
    }, [name]);
    return [items, persist, loaded];
}

function useFirestoreDoc(name, defaultValue) {
    const [value, setValue] = useState(defaultValue);

        if (!firebaseReady) {

function calculateStudentLessonHistory(student, payments, lessons) {
    if (!student) return [];

    const totalCredits = (payments || [])
        .filter(p => p.studentId === student.id)
        .reduce((sum, p) => sum + (Number(p.amount) >= UCRET_BIREYSEL_CIFT ? ODEME_KREDI_CIFT : ODEME_KREDI), 0)
        + (student.creditAdjustment ? Number(student.creditAdjustment) : 0);

    const packageSize = (student.weeklyDayIndex2 !== undefined && student.weeklyDayIndex2 !== null && student.weeklyDayIndex2 !== "")
        ? ODEME_KREDI_CIFT : ODEME_KREDI;

    const completedCredits = totalCredits > 0
        ? Math.floor(Math.max(0, totalCredits - 1) / packageSize) * packageSize
        : 0;

    const validLessons = (lessons || [])
        .filter(l => l.studentId === student.id && (l.status === "yapildi" || l.status === "mazeretsiz"))
        .slice().sort((a, b) => a.date.localeCompare(b.date));

    let usedCount = 0;
    const result = [];

    validLessons.forEach(l => {
        usedCount++;
        if (usedCount <= completedCredits) {
            return;
        }

        let tone = "neutral";
        let statusLabel = "";

        if (l.status === "mazeretsiz") {
            tone = "warning";
            statusLabel = "Mazeretsiz (Hak Yandı)";
        } else if (usedCount <= totalCredits) {
            tone = "success";
            statusLabel = "Aidat Kapsamında Yapıldı";
        } else {
            tone = "danger";
            statusLabel = "Borçlu Ders (Aidat Yatınca Yeşile Dönecek)";
        }

        result.push(Object.assign(Object.assign({}, l), { tone, statusLabel, orderIndex: usedCount }));
    });

    return result.reverse();
}

const RUSEN_AYAZ_MUAFIYET = 6;
function isRusenAyaz(teacherName) {
    return !!teacherName && teacherName.trim().toLocaleLowerCase("tr") === "ruşen ayaz";
}
function computeTeacherWeek(lessons, students, teacherId, weekKey, teacherName) {
    const weekLessons = lessons.filter(l => l.teacherId === teacherId && (l.weekKey === weekKey || (l.isTelafi && weekKeyOf(fromISODate(l.date)) === weekKey)))
        .slice().sort((a, b) => a.date.localeCompare(b.date));
    let total = 0;
    const special = isRusenAyaz(teacherName);
    let yapilanSayisi = 0;
    const rows = weekLessons.map(l => {
        const st = students.find(s => s.id === l.studentId);
        let pay = 0;
        if (l.status === "yapildi") {
            const dersUcreti = st && st.courseType === "grup" ? OGRETMEN_GRUP_OGRENCI : OGRETMEN_BIREYSEL_SAAT;
            if (special) {
                yapilanSayisi++;
                if (yapilanSayisi > RUSEN_AYAZ_MUAFIYET) pay = dersUcreti;
            } else {
                pay = dersUcreti;
            }
        }
        total += pay;
        return { lesson: l, student: st, pay };
    });
    return { rows, total };
}

function buildHakedisRowChains(rows, allTeacherLessons) {
    const byId = {};
    allTeacherLessons.forEach(l => { byId[l.id] = l; });
    const telafiByOriginal = {};
    allTeacherLessons.forEach(l => { if (l.isTelafi && l.linkedTo) telafiByOriginal[l.linkedTo] = l; });
    const payById = {};
    const studentById = {};
    rows.forEach(r => { payById[r.lesson.id] = r.pay; studentById[r.lesson.id] = r.student; });

    function chainRootOf(l) {
        let current = l;
        while (current.isTelafi && current.linkedTo && byId[current.linkedTo]) current = byId[current.linkedTo];
        return current;
    }
    function buildChain(l) {
        const chain = [l];
        let current = l;
        while (telafiByOriginal[current.id]) { current = telafiByOriginal[current.id]; chain.push(current); }
        return chain;
    }

    const seenRootIds = new Set();
    const result = [];
    rows.forEach(r => {
        const root = chainRootOf(r.lesson);
        if (seenRootIds.has(root.id)) return;
        seenRootIds.add(root.id);
        const chain = buildChain(root);
        const rowPay = chain.reduce((sum, cl) => sum + (payById[cl.id] || 0), 0);
        const student = studentById[root.id] || studentById[r.lesson.id];
        result.push({ chain, rowPay, student });
    });
    result.sort((a, b) => a.chain[0].date.localeCompare(b.chain[0].date));
    return result;
}
