<script type="text/babel" data-presets="react">

const {useState, useEffect, useMemo, useCallback} = React;

/* ---------------- Firebase başlatma ---------------- */

let app, db, auth, firebaseReady = false, firebaseError = null;
try {
  if (firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("BURAYA") === -1) {
    app = firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();

} catch (e) {

}

/* ---------------- yardımcı fonksiyonlar ---------------- */

const uid = (p="id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const GUNLER = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
const ENSTRUMANLAR = ["Piyano","Gitar","Bateri","Keman","Bas Gitar","Yan Flüt","Vokal","Ukulele","Saksafon"];

function pad(n){ return n<10 ? "0"+n : ""+n; }
function toISODate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromISODate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtTL(n){ return (Math.round(n||0)).toLocaleString("tr-TR") + " ₺"; }
function fmtDateTR(iso){ const d=fromISODate(iso); return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(); }

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function weekKeyOf(date){ return toISODate(getMonday(date)); }
function weekRangeLabel(weekKey){
  const monday = fromISODate(weekKey);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  return fmtDateTR(toISODate(monday)) + " – " + fmtDateTR(toISODate(sunday));
}
function dateForWeekday(weekKey, gunIndex){
  const monday = fromISODate(weekKey);
  const d = new Date(monday); d.setDate(d.getDate()+gunIndex);
  return toISODate(d);
}
function currentWeekKey(){ return weekKeyOf(new Date()); }
function shiftWeekKey(weekKey, delta){
  const monday = fromISODate(weekKey);
  monday.setDate(monday.getDate() + delta*7);
  return toISODate(monday);
}
function monthKeyOf(iso){ return iso.slice(0,7); }
function monthLabel(mk){
  const [y,m]=mk.split("-").map(Number);
  const ay = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  return ay[m-1]+" "+y;
}

const UCRET_BIREYSEL = 5400;
const UCRET_GRUP = 4500;
const ODEME_KREDI = 4;
const OGRETMEN_BIREYSEL_SAAT = 650;
const OGRETMEN_GRUP_OGRENCI = 450;

const C = {
  bg:"#FAF7F1", surface:"#FFFFFF", ink:"#2B2438", inkSoft:"#6B6478",
  primary:"#453A67", primaryDark:"#332B4B", accent:"#C79A2B", accentSoft:"#F1E4BE",
  success:"#3F7D58", successBg:"#E7F2EC", danger:"#B54C3C", dangerBg:"#FBEAE6", line:"#E7E1D6",
};
const cardStyle = { background:C.surface, border:"1px solid "+C.line, borderRadius:14 };
const inputStyle = { width:"100%", border:"1px solid "+C.line, borderRadius:8, padding:"8px 10px", fontSize:14, background:"white", color:C.ink };
const labelStyle = { fontSize:12, fontWeight:600, color:C.inkSoft, display:"block", marginBottom:4 };
const displayFont = { fontFamily:"Georgia, 'Times New Roman', serif" };
const monoFont = { fontFamily:"'Courier New', monospace" };

function btnStyle(kind){
  const base = { borderRadius:10, padding:"8px 14px", fontWeight:600, fontSize:14, border:"none", cursor:"pointer" };
  if(kind==="primary") return {...base, background:C.primary, color:"white"};
  if(kind==="accent") return {...base, background:C.accent, color:"white"};
  if(kind==="danger") return {...base, background:C.dangerBg, color:C.danger};
  return {...base, background:"transparent", color:C.ink, border:"1px solid "+C.line};
}

/* ---------------- Firestore ile gerçek zamanlı veri kancası ---------------- */
// Her "liste" (staff, students, lessons, payments, expenses, payouts)
// data/{ad} dokümanında {items:[...]} olarak saklanır ve onSnapshot ile
// tüm cihazlarda anlık senkronize olur.

function useFirestoreList(name){
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if(!firebaseReady) { setLoaded(true); return; }
    const ref = db.collection("data").doc(name);
    const unsub = ref.onSnapshot(snap => {
      const d = snap.data();
      setItems(d && d.items ? d.items : []);
      setLoaded(true);
    }, err => { console.error("Firestore okuma hatası", name, err); setLoaded(true); });
    return () => unsub();
  }, [name]);

  const persist = useCallback(async (next) => {
    setItems(next); // anında ekranda göster
    if(!firebaseReady) return;
    try{ await db.collection("data").doc(name).set({items: next}); }
    catch(e){ console.error("Firestore yazma hatası", name, e); }
  }, [name]);

  return [items, persist, loaded];
}

/* ---------------- küçük UI bileşenleri ---------------- */

function SectionTitle({eyebrow, title, action}){
  return (
    <div className="mb-1">
      <div className="flex items-end justify-between flex-wrap gap-2">
        <div>
          {eyebrow && <div className="text-xs font-semibold uppercase" style={{color:C.accent, letterSpacing:"0.04em"}}>{eyebrow}</div>}
          <h2 className="text-2xl" style={{...displayFont, color:C.ink}}>{title}</h2>
        </div>
        {action}
      </div>
      <div style={{height:8, marginTop:6, marginBottom:18, backgroundImage:`repeating-linear-gradient(to bottom, ${C.accent} 0px, ${C.accent} 1px, transparent 1px, transparent 3px)`, opacity:0.55}}></div>
    </div>
  );
}
function Pill({children, tone="neutral"}){
  const tones = {
    neutral:{background:"#EFEAE0", color:C.inkSoft},
    success:{background:C.successBg, color:C.success},
    danger:{background:C.dangerBg, color:C.danger},
    accent:{background:C.accentSoft, color:"#8a6a12"},
    primary:{background:"#EAE7F5", color:C.primary},
  };
  return <span className="inline-block" style={{borderRadius:999, padding:"3px 10px", fontSize:12, fontWeight:600, ...tones[tone]}}>{children}</span>;
}
function Modal({title, onClose, children, wide}){
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-3 overflow-y-auto" style={{background:"rgba(43,36,56,0.45)"}} onClick={onClose}>
      <div className={"w-full my-6 " + (wide ? "max-w-2xl" : "max-w-md")} style={{...cardStyle, padding:20}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-xl" style={displayFont}>{title}</h3>
          <button style={btnStyle("ghost")} onClick={onClose}>Kapat</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function EmptyState({text}){ return <div className="text-center py-10 text-sm" style={{color:C.inkSoft}}>{text}</div>; }
function Th({children}){ return <th className="text-left" style={{fontSize:12, textTransform:"uppercase", letterSpacing:"0.04em", color:C.inkSoft, fontWeight:600, padding:"8px 10px", borderBottom:"1px solid "+C.line}}>{children}</th>; }
function Td({children, className, style}){ return <td className={className} style={{padding:10, borderBottom:"1px solid "+C.line, fontSize:14, verticalAlign:"middle", ...style}}>{children}</td>; }

/* ---------------- Bağlantı durumu ekranı ---------------- */

function ConnectionGate({children}){
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState(null);

  useEffect(() => {
    if(!firebaseReady){ setAuthReady(true); return; }
    auth.signInAnonymously().then(()=>setAuthReady(true)).catch(err=>{ setAuthError(err); setAuthReady(true); });
  }, []);

  if(!firebaseReady){
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{background:C.bg}}>
        <div style={{...cardStyle, padding:24, maxWidth:480}}>
          <h2 className="text-xl mb-2" style={displayFont}>Firebase bağlantısı eksik</h2>
          <p className="text-sm" style={{color:C.inkSoft}}>
            Bu dosyanın en üstündeki <code>firebaseConfig</code> bilgileri henüz doldurulmamış.
            Firebase Console'dan aldığınız proje bilgilerini dosyanın başına yapıştırıp tekrar yükleyin.
          </p>
        </div>
      </div>
    );
  }
  if(!authReady){
    return <div className="min-h-screen flex items-center justify-center" style={{color:C.inkSoft, background:C.bg}}>Bağlanıyor…</div>;
  }
  if(authError){
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{background:C.bg}}>
        <div style={{...cardStyle, padding:24, maxWidth:480}}>
          <h2 className="text-xl mb-2" style={displayFont}>Bağlantı hatası</h2>
          <p className="text-sm" style={{color:C.inkSoft}}>{String(authError.message||authError)}</p>
        </div>
      </div>
    );
  }
  return children;
}

/* ---------------- Ana Uygulama ---------------- */

function App(){
  const [staff, setStaff, staffLoaded] = useFirestoreList("staff-list");
  const [students, setStudents, studentsLoaded] = useFirestoreList("students-list");
  const [lessons, setLessons, lessonsLoaded] = useFirestoreList("lessons-list");
  const [payments, setPayments, paymentsLoaded] = useFirestoreList("payments-list");
  const [expenses, setExpenses, expensesLoaded] = useFirestoreList("expenses-list");
  const [payouts, setPayouts, payoutsLoaded] = useFirestoreList("payouts-list");

  const allLoaded = staffLoaded && studentsLoaded && lessonsLoaded && paymentsLoaded && expensesLoaded && payoutsLoaded;

  const [role, setRole] = useState("kurucu");
  const [activeTeacherId, setActiveTeacherId] = useState(null);
  const [tab, setTab] = useState("panel");

  const teachers = useMemo(() => staff.filter(s=>s.role==="ogretmen"), [staff]);

  useEffect(() => {
    if(role==="ogretmen" && !activeTeacherId && teachers.length>0) setActiveTeacherId(teachers[0].id);
  }, [role, teachers, activeTeacherId]);

  const studentCredit = useCallback((studentId) => {
    const paid = payments.filter(p=>p.studentId===studentId).length * ODEME_KREDI;
    const used = lessons.filter(l => l.studentId===studentId && (l.status==="yapildi" || l.status==="mazeretsiz")).length;
    return paid - used;
  }, [payments, lessons]);

  const ensureWeekLessons = useCallback((weekKey) => {
    const existingKeys = new Set(lessons.filter(l=>l.weekKey===weekKey && !l.isTelafi).map(l=>l.studentId));
    const toAdd = [];
    students.forEach(st => {
      if(st.status!=="aktif") return;
      if(st.weeklyDayIndex===undefined || st.weeklyDayIndex===null) return;
      if(existingKeys.has(st.id)) return;
      toAdd.push({
        id: uid("ders"), studentId: st.id, teacherId: st.teacherId,
        date: dateForWeekday(weekKey, st.weeklyDayIndex), weekKey,
        status:"bekliyor", isTelafi:false, linkedTo:null, telafiForDate:null,
      });
    });
    if(toAdd.length>0) setLessons([...lessons, ...toAdd]);
  }, [lessons, students, setLessons]);

  if(!allLoaded){
    return <div className="min-h-screen flex items-center justify-center" style={{color:C.inkSoft, background:C.bg}}>Veriler yükleniyor…</div>;
  }

  const teacherById = (id) => staff.find(s=>s.id===id);
  const studentById = (id) => students.find(s=>s.id===id);

  const TABS_KURUCU = [
    {k:"panel", t:"Panel"}, {k:"personel", t:"Personel"}, {k:"ogrenciler", t:"Öğrenciler"},
    {k:"dersler", t:"Ders Takvimi"}, {k:"odemeler", t:"Ödemeler"}, {k:"hakedis", t:"Hakedişler"},
    {k:"giderler", t:"Giderler"}, {k:"rapor", t:"Kâr/Zarar"},
  ];
  const TABS_MUDUR = [{k:"ogrenciler", t:"Öğrenciler"}, {k:"dersler", t:"Ders Takvimi"}, {k:"odemeler", t:"Ödemeler"}];
  const TABS_OGRETMEN = [{k:"ogretmen-dersler", t:"Derslerim"}, {k:"ogretmen-hakedis", t:"Hakedişim"}];
  const tabs = role==="kurucu" ? TABS_KURUCU : role==="mudur" ? TABS_MUDUR : TABS_OGRETMEN;

  return (
    <div className="min-h-screen" style={{background:C.bg, color:C.ink}}>
      <header style={{background:C.primary}} className="text-white sticky top-0 z-30">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-2">
            <div className="text-2xl" style={{...displayFont, letterSpacing:"0.02em"}}>Mimaroba Müzik Kursu</div>
            <span className="text-xs opacity-70 hidden sm:inline">Kurs Yönetim Sistemi</span>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <select value={role} onChange={e=>{setRole(e.target.value); setActiveTeacherId(null);}}
              className="text-sm" style={{background:"rgba(255,255,255,0.12)", color:"white", border:"1px solid rgba(255,255,255,0.3)", borderRadius:8, padding:"6px 10px"}}>
              <option value="kurucu" style={{color:"#000"}}>Kurucu girişi</option>
              <option value="mudur" style={{color:"#000"}}>Müdür girişi</option>
              <option value="ogretmen" style={{color:"#000"}}>Öğretmen girişi</option>
            </select>
            {role==="ogretmen" && (
              <select value={activeTeacherId||""} onChange={e=>setActiveTeacherId(e.target.value)}
                className="text-sm" style={{background:"rgba(255,255,255,0.12)", color:"white", border:"1px solid rgba(255,255,255,0.3)", borderRadius:8, padding:"6px 10px"}}>
                <option value="" style={{color:"#000"}}>Öğretmen seç</option>
                {teachers.map(t=> <option key={t.id} value={t.id} style={{color:"#000"}}>{t.name}</option>)}
              </select>
            )}
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto pb-2">
          {tabs.map(x => (
            <button key={x.k} onClick={()=>setTab(x.k)} className="text-sm whitespace-nowrap px-3 py-1.5"
              style={{borderRadius:"8px 8px 0 0", background: tab===x.k ? C.bg : "transparent", color: tab===x.k ? C.primary : "rgba(255,255,255,0.85)", fontWeight: tab===x.k ? 700 : 500, border:"none", cursor:"pointer"}}>
              {x.t}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {tab==="panel" && <PanelTab {...{staff, students, lessons, payments, studentCredit}} />}
        {tab==="personel" && <PersonelTab {...{staff, setStaff}} />}
        {tab==="ogrenciler" && <OgrencilerTab {...{students, setStudents, teachers, payments, setPayments, studentCredit}} />}
        {tab==="dersler" && <DersTakvimiTab {...{lessons, setLessons, students, ensureWeekLessons, teacherById, studentById}} />}
        {tab==="odemeler" && <OdemelerTab {...{students, payments, setPayments, studentCredit}} />}
        {tab==="hakedis" && <HakedisTab {...{lessons, students, teachers, payouts, setPayouts}} />}
        {tab==="giderler" && <GiderlerTab {...{expenses, setExpenses}} />}
        {tab==="rapor" && <RaporTab {...{payments, payouts, expenses}} />}
        {tab==="ogretmen-dersler" && (activeTeacherId
          ? <DersTakvimiTab {...{lessons, setLessons, students, ensureWeekLessons, teacherById, studentById}} onlyTeacherId={activeTeacherId} />
          : <EmptyState text="Üstteki menüden bir öğretmen seçin." />)}
        {tab==="ogretmen-hakedis" && (activeTeacherId
          ? <HakedisTab {...{lessons, students, teachers, payouts, setPayouts}} onlyTeacherId={activeTeacherId} />
          : <EmptyState text="Üstteki menüden bir öğretmen seçin." />)}
      </main>
      <footer className="text-center text-xs py-8" style={{color:C.inkSoft}}>
        Veriler gerçek zamanlı olarak ortak veritabanında saklanır — tüm cihazlarda anında senkronize olur.
      </footer>
    </div>
  );
}

/* ---------------- Panel ---------------- */

function PanelTab({staff, students, lessons, payments, studentCredit}){
  const aktifOgrenci = students.filter(s=>s.status==="aktif");
  const borcluSayisi = aktifOgrenci.filter(s=>studentCredit(s.id)<0).length;
  const bugun = toISODate(new Date());
  const bugunkuDersler = lessons.filter(l=>l.date===bugun);
  const thisWeek = currentWeekKey();
  const buHaftaGelir = payments.filter(p=> weekKeyOf(fromISODate(p.date))===thisWeek).reduce((a,p)=>a+p.amount,0);

  return (
    <div>
      <SectionTitle eyebrow="Genel Bakış" title="Panel" />
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <StatCard label="Aktif Öğrenci" value={aktifOgrenci.length} />
        <StatCard label="Öğretmen Sayısı" value={staff.filter(s=>s.role==="ogretmen").length} />
        <StatCard label="Borçlu Öğrenci" value={borcluSayisi} tone={borcluSayisi>0 ? "danger":"success"} />
        <StatCard label="Bugünkü Ders" value={bugunkuDersler.length} />
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div style={{...cardStyle, padding:16}}>
          <h3 className="text-lg mb-2" style={displayFont}>Bu haftanın tahsilatı</h3>
          <div className="text-2xl" style={{...monoFont, color:C.primary}}>{fmtTL(buHaftaGelir)}</div>

function DersTakvimiTab({lessons, setLessons, students, ensureWeekLessons, teacherById, studentById, onlyTeacherId}){
  const [weekKey, setWeekKey] = useState(currentWeekKey());
  const [telafiFor, setTelafiFor] = useState(null);
  const [telafiDate, setTelafiDate] = useState("");
  useEffect(() => { ensureWeekLessons(weekKey); /* eslint-disable-next-line */ }, [weekKey]);

  let weekLessons = lessons.filter(l => l.weekKey===weekKey || (l.isTelafi && l.date && weekKeyOf(fromISODate(l.date))===weekKey));
  if(onlyTeacherId) weekLessons = weekLessons.filter(l=>l.teacherId===onlyTeacherId);
  weekLessons = weekLessons.slice().sort((a,b)=> a.date.localeCompare(b.date));

  function setStatus(lessonId, status){
    if(status==="mazeretli"){ setTelafiFor(lessonId); setTelafiDate(""); return; }
    setLessons(lessons.map(l => l.id===lessonId ? {...l, status} : l));
  }
  function confirmMazeret(){
    if(!telafiDate){ alert("Telafi ders günü seçin."); return; }
    const orig = lessons.find(l=>l.id===telafiFor);
    if(!orig) return;
    const updated = lessons.map(l => l.id===telafiFor ? {...l, status:"mazeretli"} : l);
    updated.push({id: uid("ders"), studentId:orig.studentId, teacherId:orig.teacherId, date:telafiDate, weekKey: weekKeyOf(fromISODate(telafiDate)), status:"bekliyor", isTelafi:true, linkedTo:orig.id, telafiForDate:orig.date});
    setLessons(updated);
    setTelafiFor(null);
  }
  const statusMeta = {
    bekliyor:{label:"Bekliyor", tone:"neutral"}, yapildi:{label:"Yapıldı", tone:"success"},
    mazeretli:{label:"Mazeretli (telafi planlandı)", tone:"accent"}, mazeretsiz:{label:"Mazeretsiz (ders hakkı yandı)", tone:"danger"},
  };

  return (
    <div>
      <SectionTitle eyebrow="Yoklama" title="Ders Takvimi" action={
        <div className="flex items-center gap-2">
          <button style={btnStyle("ghost")} onClick={()=>setWeekKey(shiftWeekKey(weekKey,-1))}>‹ Önceki</button>
          <span className="text-sm font-medium" style={monoFont}>{weekRangeLabel(weekKey)}</span>
          <button style={btnStyle("ghost")} onClick={()=>setWeekKey(shiftWeekKey(weekKey,1))}>Sonraki ›</button>
        </div>} />
      {weekLessons.length===0 ? <EmptyState text="Bu hafta için ders kaydı yok." /> : (
        <div style={{...cardStyle, overflowX:"auto"}}>
          <table className="w-full">
            <thead><tr><Th>Tarih</Th><Th>Öğrenci</Th><Th>Öğretmen</Th><Th>Tür</Th><Th>Durum</Th><Th></Th></tr></thead>
            <tbody>
              {weekLessons.map(l => {
                const st = studentById(l.studentId); const tc = teacherById(l.teacherId);
                if(!st) return null;
                return (
                  <tr key={l.id}>
                    <Td style={monoFont}>{fmtDateTR(l.date)}{l.isTelafi && <span className="ml-1"><Pill tone="accent">Telafi</Pill></span>}</Td>
                    <Td>{st.name}</Td><Td>{tc ? tc.name : "—"}</Td><Td>{st.courseType==="bireysel" ? "Bireysel" : "Grup"}</Td>
                    <Td><Pill tone={statusMeta[l.status].tone}>{statusMeta[l.status].label}</Pill></Td>
                    <Td className="text-right whitespace-nowrap">
                      {l.status==="bekliyor" ? (
                        <div className="flex gap-1 justify-end">
                          <button style={btnStyle("primary")} onClick={()=>setStatus(l.id,"yapildi")}>Yapıldı</button>
                          <button style={btnStyle("accent")} onClick={()=>setStatus(l.id,"mazeretli")}>Mazeretli</button>
                          <button style={btnStyle("danger")} onClick={()=>setStatus(l.id,"mazeretsiz")}>Mazeretsiz</button>
                        </div>
                      ) : (<button style={btnStyle("ghost")} onClick={()=>setLessons(lessons.map(x=>x.id===l.id?{...x,status:"bekliyor"}:x))}>Geri Al</button>)}
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      {telafiFor && (
        <Modal title="Telafi Dersi Planla" onClose={()=>setTelafiFor(null)}>
          <p className="text-sm mb-3" style={{color:C.inkSoft}}>Öğrenci önceden haber verdiği için bu dersin hakkı yanmayacak. Telafi dersi için yeni bir tarih seçin.</p>
          <label style={labelStyle}>Telafi Tarihi</label>
          <input style={inputStyle} type="date" value={telafiDate} onChange={e=>setTelafiDate(e.target.value)} />
          <div className="flex justify-end gap-2 pt-4">
            <button style={btnStyle("ghost")} onClick={()=>setTelafiFor(null)}>Vazgeç</button>
            <button style={btnStyle("primary")} onClick={confirmMazeret}>Kaydet</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function computeTeacherWeek(lessons, students, teacherId, weekKey){
  const weekLessons = lessons.filter(l => l.teacherId===teacherId && (l.weekKey===weekKey || (l.isTelafi && weekKeyOf(fromISODate(l.date))===weekKey)));
  let total = 0;
  const rows = weekLessons.map(l => {
    const st = students.find(s=>s.id===l.studentId);
    let pay = 0;
    if(l.status==="yapildi") pay = st && st.courseType==="grup" ? OGRETMEN_GRUP_OGRENCI : OGRETMEN_BIREYSEL_SAAT;
    total += pay;
    return {lesson:l, student:st, pay};
  }).sort((a,b)=>a.lesson.date.localeCompare(b.lesson.date));
  return {rows, total};
}

    if(existing) setPayouts(payouts.map(p => p===existing ? {...p, paid:true, amount:total, paidDate: toISODate(new Date())} : p));
    else setPayouts([...payouts, {id: uid("pay"), teacherId, weekKey, amount: total, paid:true, paidDate: toISODate(new Date())}]);
  }
  function unmarkPaid(teacherId){ setPayouts(payouts.map(p => (p.teacherId===teacherId && p.weekKey===weekKey) ? {...p, paid:false} : p)); }
  return (
    <div>
      <SectionTitle eyebrow="Pazar Ödemesi" title="Öğretmen Hakedişleri" action={
        <div className="flex items-center gap-2">
          <button style={btnStyle("ghost")} onClick={()=>setWeekKey(shiftWeekKey(weekKey,-1))}>‹ Önceki</button>
          <span className="text-sm font-medium" style={monoFont}>{weekRangeLabel(weekKey)}</span>
          <button style={btnStyle("ghost")} onClick={()=>setWeekKey(shiftWeekKey(weekKey,1))}>Sonraki ›</button>
        </div>} />
      {list.length===0 ? <EmptyState text="Kayıtlı öğretmen yok." /> : (
        <div className="space-y-4">
          {list.map(t => {
            const {rows, total} = computeTeacherWeek(lessons, students, t.id, weekKey);
            const payoutRec = payouts.find(p=>p.teacherId===t.id && p.weekKey===weekKey);
            const isPaid = payoutRec && payoutRec.paid;
            return (
              <div style={{...cardStyle, padding:16}} key={t.id}>
                <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                  <div><h3 className="text-lg" style={displayFont}>{t.name}</h3><p className="text-xs" style={{color:C.inkSoft}}>{(t.instruments||[]).join(", ")}</p></div>
                  <div className="text-right">
                    <div className="text-xl" style={{...monoFont, color:C.primary}}>{fmtTL(total)}</div>
                    {isPaid ? (
                      <div className="flex items-center gap-2 justify-end mt-1"><Pill tone="success">Ödendi — {fmtDateTR(payoutRec.paidDate)}</Pill><button style={btnStyle("ghost")} onClick={()=>unmarkPaid(t.id)}>Geri al</button></div>
                    ) : (<button style={{...btnStyle("accent"), marginTop:4, opacity: rows.length===0?0.5:1}} onClick={()=>markPaid(t.id,total)} disabled={rows.length===0}>Ödendi olarak işaretle</button>)}
                  </div>
                </div>
                {rows.length===0 ? <p className="text-sm" style={{color:C.inkSoft}}>Bu hafta ders kaydı yok.</p> : (
                  <table className="w-full">
                    <thead><tr><Th>Tarih</Th><Th>Öğrenci</Th><Th>Tür</Th><Th>Durum</Th><Th>Tutar</Th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.lesson.id}>
                          <Td style={monoFont}>{fmtDateTR(r.lesson.date)}</Td><Td>{r.student ? r.student.name : "—"}</Td>
                          <Td>{r.student && r.student.courseType==="grup" ? "Grup" : "Bireysel"}</Td>
                          <Td>
                            {r.lesson.status==="yapildi" && <Pill tone="success">Yapıldı</Pill>}
                            {r.lesson.status==="mazeretli" && <Pill tone="accent">Mazeretli (ücretsiz)</Pill>}
                            {r.lesson.status==="mazeretsiz" && <Pill tone="danger">Mazeretsiz (ücretsiz)</Pill>}
                            {r.lesson.status==="bekliyor" && <Pill>Bekliyor</Pill>}
                          </Td>
                          <Td style={monoFont}>{r.pay>0 ? fmtTL(r.pay) : "—"}</Td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- Giderler ---------------- */

function GiderlerTab({expenses, setExpenses}){
  const [desc, setDesc] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(toISODate(new Date()));
  function add(){ if(!desc.trim() || !amount) return; setExpenses([...expenses, {id: uid("gid"), description:desc, amount:Number(amount), date}]); setDesc(""); setAmount(""); }
  function remove(id){ setExpenses(expenses.filter(e=>e.id!==id)); }
  const sorted = expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <div>
      <SectionTitle eyebrow="Kurucu Girişi" title="Giderler" />
      <div style={{...cardStyle, padding:16, marginBottom:20}}>
        <h3 className="text-lg mb-3" style={displayFont}>Yeni Gider</h3>
        <div className="grid md:grid-cols-4 gap-3 items-end">
          <div className="md:col-span-2"><label style={labelStyle}>Açıklama</label><input style={inputStyle} type="text" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Kira, fatura, malzeme…" /></div>
          <div><label style={labelStyle}>Tutar (₺)</label><input style={inputStyle} type="number" value={amount} onChange={e=>setAmount(e.target.value)} /></div>
          <div><label style={labelStyle}>Tarih</label><input style={inputStyle} type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
        </div>
        <div className="flex justify-end mt-3"><button style={btnStyle("primary")} onClick={add}>Gideri Kaydet</button></div>
      </div>
      {sorted.length===0 ? <EmptyState text="Henüz gider kaydı yok." /> : (
        <div style={{...cardStyle, overflowX:"auto"}}>
          <table className="w-full">
            <thead><tr><Th>Tarih</Th><Th>Açıklama</Th><Th>Tutar</Th><Th></Th></tr></thead>
            <tbody>{sorted.map(e => (<tr key={e.id}><Td style={monoFont}>{fmtDateTR(e.date)}</Td><Td>{e.description}</Td><Td style={monoFont}>{fmtTL(e.amount)}</Td><Td className="text-right"><button style={btnStyle("danger")} onClick={()=>remove(e.id)}>Sil</button></Td></tr>))}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- Kâr / Zarar Raporu ---------------- */

function RaporTab({payments, payouts, expenses}){
  const months = useMemo(() => {
    const set = new Set();
    payments.forEach(p=>set.add(monthKeyOf(p.date)));
    expenses.forEach(e=>set.add(monthKeyOf(e.date)));
    payouts.forEach(p=>{ if(p.paid && p.paidDate) set.add(monthKeyOf(p.paidDate)); });
    set.add(monthKeyOf(toISODate(new Date())));
    return Array.from(set).sort().reverse();
  }, [payments, expenses, payouts]);
  const [month, setMonth] = useState(months[0]);
  useEffect(() => { if(!months.includes(month)) setMonth(months[0]); }, [months]);
  const gelir = payments.filter(p=>monthKeyOf(p.date)===month).reduce((a,p)=>a+p.amount,0);
  const ogretmenOdeme = payouts.filter(p=>p.paid && p.paidDate && monthKeyOf(p.paidDate)===month).reduce((a,p)=>a+p.amount,0);
  const digerGider = expenses.filter(e=>monthKeyOf(e.date)===month).reduce((a,e)=>a+e.amount,0);
  const kar = gelir - (ogretmenOdeme + digerGider);
  return (
    <div>
      <SectionTitle eyebrow="Aylık Özet" title="Kâr / Zarar" action={
        <select style={{...inputStyle, width:"auto"}} value={month} onChange={e=>setMonth(e.target.value)}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select>} />
      <div className="grid md:grid-cols-4 gap-3 mb-5">
        <StatCard label="Öğrenci Gelirleri" value={fmtTL(gelir)} />
        <StatCard label="Öğretmen Ödemeleri" value={fmtTL(ogretmenOdeme)} />
        <StatCard label="Diğer Giderler" value={fmtTL(digerGider)} />
        <StatCard label={kar>=0 ? "Net Kâr" : "Net Zarar"} value={fmtTL(Math.abs(kar))} tone={kar>=0?"success":"danger"} />
      </div>
      <div style={{...cardStyle, padding:16}}>
        <h3 className="text-lg mb-3" style={displayFont}>{monthLabel(month)} Özeti</h3>
        <table className="w-full"><tbody>
          <tr><Td>Öğrenci aidat gelirleri</Td><Td className="text-right" style={monoFont}>{fmtTL(gelir)}</Td></tr>
          <tr><Td>Öğretmen hakediş ödemeleri</Td><Td className="text-right" style={{...monoFont, color:C.danger}}>− {fmtTL(ogretmenOdeme)}</Td></tr>
          <tr><Td>Diğer giderler</Td><Td className="text-right" style={{...monoFont, color:C.danger}}>− {fmtTL(digerGider)}</Td></tr>
          <tr><Td className="font-semibold">Net {kar>=0?"kâr":"zarar"}</Td><Td className="text-right font-semibold" style={{...monoFont, color: kar>=0?C.success:C.danger}}>{fmtTL(kar)}</Td></tr>
        </tbody></table>
      </div>
    </div>
  );
}

/* ---------------- Render ---------------- */

ReactDOM.createRoot(document.getElementById("root")).render(<ConnectionGate><App/></ConnectionGate>);

</script>
</body>
